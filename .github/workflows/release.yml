name: Release on merge

on:
  push:
    branches: [main]

permissions:
  contents: read # checkout only
  packages: write # needed to push the image to GHCR

# Don't cancel an in-flight release; let each push finish serially.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        # <Version> in the csproj is the single source of truth for the image tag.
        run: |
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' LetterGenerator/LetterGenerator.csproj)
          if [ -z "$version" ]; then
            echo "::error file=LetterGenerator/LetterGenerator.csproj::Could not read <Version>."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Runners are amd64, matching the droplet, but pinning it means an arm64 runner
          # would never silently produce an image the droplet can't run.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          # Records the commit on the image, so a running container can be traced back to source.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # Persists the Docker layer cache between runs, so the restore layer is reused
          # whenever the csproj is unchanged.
          cache-from: type=gha
          cache-to: type=gha,mode=max
